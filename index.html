<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Ajedrez">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Ajedrez con Entrenador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#262421">
<style>
/* Estilo inspirado en chess.com: tablero verde/crema sobre gris cálido oscuro. Columna tablero + panel lateral; en celular, tablero arriba y barra inferior. */
:root{
  --bg:#312e2b; --side:#262421; --panel:#262522; --panel2:#1f1e1b; --line:#3c3a37;
  --fg:#ffffff; --muted:#bab9b8; --dim:#8b8987;
  --green:#81b64c; --green-d:#45753c; --green-t:#c7e6a3;
  --sqL:#ebecd0; --sqD:#739552; --hlL:#f5f682; --hlD:#b9ca43;
  --warn:#f7c631; --bad:#fa412d; --blue:#5d9fd3;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --pc:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans","Apple Symbols","Arial Unicode MS",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{display:flex;min-height:100%}
/* barra lateral */
.side{width:148px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:10px 6px;gap:2px;position:sticky;top:0;height:100vh;padding-left:max(6px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:8px;padding:8px 10px 16px;font-weight:800;font-size:17px;letter-spacing:-.2px}
.logo b{color:var(--green)}
.logo .mk{width:30px;height:30px;border-radius:7px;background:var(--green);display:grid;place-items:center;font-family:var(--pc);font-size:22px;color:#fff;box-shadow:inset 0 -3px 0 var(--green-d)}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:6px;color:var(--muted);font-weight:600;font-size:14px;text-align:left}
.nav:hover{background:#1c1b19;color:#fff}
.nav.on{background:#1c1b19;color:#fff}
.nav .ic{width:22px;text-align:center;font-family:var(--pc);font-size:19px}
.side .foot{margin-top:auto;padding:10px;color:var(--dim);font-size:12px;line-height:1.4}
.bottomnav{display:none}
/* principal */
.main{flex:1;display:flex;gap:24px;padding-block:18px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));justify-content:center;align-items:flex-start;min-width:0}
.bcol{--bsz:min(640px,calc(100vh - 128px),calc(100vw - 148px - 400px - 96px));width:calc(var(--bsz) + 30px);flex:none}
.pbar{display:flex;align-items:center;gap:10px;height:44px;padding:0 0 0 30px}
.av{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.pname{font-weight:700;font-size:14px;line-height:1.15;min-width:0}
.pname small{color:var(--dim);font-weight:500;margin-left:4px}
.capt{font-family:var(--pc);color:var(--muted);font-size:15px;letter-spacing:-3px;line-height:1;margin-top:2px;min-height:15px}
.capt i{font-style:normal;font-family:var(--ui);letter-spacing:0;font-size:12px;margin-left:6px;color:var(--dim)}
.think{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.think span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.think span:nth-child(2){animation-delay:.15s}.think span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.bwrap{display:flex;gap:8px;align-items:stretch}
.evalbar{width:22px;flex:none;background:#403d39;border-radius:3px;position:relative;overflow:hidden}
.evalbar .fill{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .5s ease}
.evalbar .num{position:absolute;left:0;right:0;font-size:10px;font-weight:800;text-align:center;z-index:2}
.evalbar.flip .fill{bottom:auto;top:0}
.board{width:var(--bsz);height:var(--bsz);position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:3px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.sq{position:relative;display:grid;place-items:center}
.sq.l{background:var(--sqLbg,var(--sqL))}.sq.d{background:var(--sqDbg,var(--sqD))}
.sq.hl::before,.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,255,40,.42)}
.pcs{width:100%;height:100%;position:relative;z-index:1;pointer-events:none;filter:drop-shadow(0 calc(var(--bsz)/300) calc(var(--bsz)/400) rgba(0,0,0,.28))}
.pcs.ghost{opacity:.35}
.drag .pcs{width:108%;height:108%}
.promo button .pcs{width:90%;height:90%}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw2,.sw3{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:7px;background:var(--panel2);border:2px solid transparent;font-size:12px;color:var(--muted);font-weight:600}
.sw2.on,.sw3.on{border-color:var(--green);color:#fff}
.sw2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.sw2 span{aspect-ratio:1;width:100%}
.sw2 span:nth-child(1){border-top-left-radius:3px}.sw2 span:nth-child(2){border-top-right-radius:3px}.sw2 span:nth-child(3){border-bottom-left-radius:3px}.sw2 span:nth-child(4){border-bottom-right-radius:3px}
.sw2 em{grid-column:1/-1;font-style:normal;margin-top:5px;text-align:center}
.sw3 .pv{display:flex;background:var(--sqL);border-radius:4px;width:100%;justify-content:center;padding:2px 0}
.sw3 .pv .pcs{width:48%;height:auto;aspect-ratio:1}
.sw3 .pv .pc{font-size:26px}
.sw3 em{font-style:normal}
.snds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.snd{height:38px;border-radius:7px;background:var(--panel2);border:2px solid transparent;font-weight:700;font-size:13px;color:var(--muted)}
.snd.on{border-color:var(--green);color:#fff}
.sq.hint::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px var(--blue)}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ff2f2f 0%,rgba(231,0,0,.9) 30%,rgba(169,0,0,0) 72%)}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.16)}
.sq .ring{position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--bsz)/90) rgba(0,0,0,.16)}
.co{z-index:2;position:absolute;font-size:calc(var(--bsz)/52);font-weight:700;line-height:1;pointer-events:none}
.co.r{top:3px;left:3px}.co.f{bottom:2px;right:4px}
.sq.l .co{color:var(--coL,var(--sqD))}.sq.d .co{color:var(--coD,var(--sqL))}
.pc{font-family:var(--pc);font-size:calc(var(--bsz)/8*.82);line-height:1;position:relative;z-index:1;cursor:grab;transform:translateY(-2%);pointer-events:none}
.pc.w{color:#fafafa;-webkit-text-stroke:calc(var(--bsz)/700) #1a1a1a;text-shadow:0 2px 2px rgba(0,0,0,.35)}
.pc.b{color:#262421;-webkit-text-stroke:calc(var(--bsz)/900) #000;text-shadow:0 2px 2px rgba(0,0,0,.25)}
.pc.ghost{opacity:.35}
.drag{position:absolute;z-index:20;pointer-events:none;display:grid;place-items:center;width:calc(var(--bsz)/8);height:calc(var(--bsz)/8)}
.drag .pc{font-size:calc(var(--bsz)/8*.95);transform:none}
.badge{position:absolute;top:-6%;right:-6%;width:38%;height:38%;max-width:30px;max-height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:calc(var(--bsz)/58);z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.5);font-family:var(--ui);letter-spacing:-.5px}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:6}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:30;display:grid;place-items:center}
.promo div{display:flex;gap:6px;background:var(--panel);padding:10px;border-radius:8px}
.promo button{width:calc(var(--bsz)/7);height:calc(var(--bsz)/7);border-radius:6px;background:var(--sqL);display:grid;place-items:center}
.promo button .pc{pointer-events:none}
.navbtns{display:flex;gap:4px;padding-left:30px;margin-top:8px}
.navbtns button{flex:1;height:34px;border-radius:5px;background:#3c3a37;color:var(--muted);font-size:16px;font-weight:800}
.navbtns button:hover{background:#4b4845;color:#fff}
/* panel */
.panel{width:400px;flex:none;background:var(--panel);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 36px);position:sticky;top:18px;overflow:hidden;min-width:0}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph h2{margin:0;font-size:17px;font-weight:800;text-wrap:balance}
.ph .back{width:30px;height:30px;border-radius:5px;background:#3c3a37;font-weight:900;color:var(--muted)}
.pbody{padding:14px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.pfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 16px;border-radius:7px;font-weight:800;background:#454340;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn:hover{background:#524f4b}
.btn.go{background:var(--green);box-shadow:inset 0 -4px 0 var(--green-d);font-size:17px;height:52px}
.btn.go:hover{background:#96c95f}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn.f1{flex:1}
.btn[disabled]{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.lead{color:var(--muted);line-height:1.5;margin:0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:700}
/* bots */
.bots{display:flex;flex-direction:column;gap:6px}
.bot{display:flex;align-items:center;gap:12px;padding:10px;border-radius:7px;background:var(--panel2);text-align:left;border:2px solid transparent}
.bot:hover{background:#2c2a27}
.bot.on{border-color:var(--green);background:#2c2a27}
.bot .av{width:44px;height:44px;font-size:18px}
.bot .bt{flex:1;min-width:0}
.bot .bt b{font-size:15px;display:block}
.bot .bt span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.bot .bt b .tag{display:inline-block;vertical-align:middle;margin:0 0 0 6px;font-size:10.5px}
.bot .elo{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--panel2);border-radius:7px;padding:3px;gap:3px}
.seg button{white-space:nowrap;flex:1;height:38px;border-radius:5px;font-weight:700;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#454340;color:#fff}

.tog{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border-radius:7px;text-align:left;width:100%}
.tog .sw{width:40px;height:22px;border-radius:11px;background:#55524e;position:relative;flex:none;transition:.2s}
.tog .sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.tog.on .sw{background:var(--green)}.tog.on .sw::after{left:20px}
.tog div b{display:block;font-size:14px}.tog div span{font-size:12.5px;color:var(--muted)}
/* entrenador */
.coach{display:flex;gap:10px;align-items:flex-start}
.coach .cav{width:42px;height:42px;border-radius:50%;background:#e8e2d6;flex:none;display:grid;place-items:center;font-family:var(--pc);font-size:28px;color:#262421;box-shadow:0 0 0 2px var(--green)}
.bub{background:#fff;color:#262421;border-radius:10px;padding:11px 13px;line-height:1.45;font-size:14.5px;position:relative;flex:1;min-width:0}
.bub::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-left:0;border-right-color:#fff}
.bub .ct{display:flex;align-items:center;gap:7px;font-weight:800;margin-bottom:4px;font-size:15px}
.bub .ct .chip{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;flex:none}
.bub p{margin:4px 0 0}
.bub .warn{margin-top:8px;padding:7px 9px;border-radius:6px;background:#fff3cd;color:#6b4e00;font-weight:600;font-size:13.5px}
.bub .warn.mate{background:#ffd7d2;color:#8a1300}
.bub .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.bub .acts button{font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:5px;background:#eeede9;color:#3a3936}
.bub .acts button:hover{background:#e0dfda}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tools button{background:var(--panel2);border-radius:7px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.tools button:hover{background:#2c2a27;color:#fff}
.tools button .i{font-size:18px;line-height:1;color:#fff}
.plan{display:flex;flex-direction:column;gap:6px}
.plan div{background:var(--panel2);border-radius:7px;padding:9px 11px;border-left:3px solid var(--green)}
.plan b{display:block;font-size:13.5px;margin-bottom:2px}
.plan span{font-size:13.5px;color:var(--muted);line-height:1.4}
.moves{display:grid;grid-template-columns:36px 1fr 1fr;font-size:14px;background:var(--panel2);border-radius:7px;overflow:hidden}
.moves .n{color:var(--dim);padding:5px 0 5px 10px;font-variant-numeric:tabular-nums;background:#1b1a18}
.moves .mv{padding:5px 8px;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer;border-radius:3px;min-width:0}
.moves .mv:hover{background:#2c2a27}
.moves .mv.cur{background:#484644}
.moves .mv i{font-style:normal;font-size:10px;font-weight:900;min-width:16px;height:16px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;padding:0 3px}
/* tarjetas de lecciones */
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel2);border-radius:8px;padding:12px;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
.card:hover{background:#2c2a27}
.card .ci{width:46px;height:46px;border-radius:7px;background:#3c3a37;display:grid;place-items:center;font-family:var(--pc);font-size:28px;flex:none}
.card .ct2{flex:1;min-width:0}
.card b{display:block;font-size:15px}
.card span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.card .done{color:var(--green);font-weight:900;font-size:18px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:#3c3a37;color:var(--muted);margin-top:5px}
.theory{background:var(--panel2);border-radius:8px;padding:12px 14px;line-height:1.55;color:#e6e5e3;font-size:14.5px}
.theory b{color:#fff}
.tipbox{border-left:3px solid var(--warn);background:#2e2b22;padding:9px 12px;border-radius:0 7px 7px 0;font-size:14px;line-height:1.45;color:#ece6d2}
.prog{height:8px;border-radius:4px;background:#3c3a37;overflow:hidden}
.prog div{height:100%;background:var(--green);transition:width .3s}
.steptext{font-size:15.5px;line-height:1.5}
.ok{color:var(--green-t)}.no{color:#ffb3a8}
.sumlist{margin:0;padding-left:18px;line-height:1.6;color:#e6e5e3}
/* resultados */
.result{text-align:center;padding:6px 0 2px}
.result h3{margin:0;font-size:26px;font-weight:900}
.result p{margin:4px 0 0;color:var(--muted)}
.acc{display:flex;gap:10px}
.acc div{flex:1;background:var(--panel2);border-radius:8px;padding:12px;text-align:center}
.acc b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.acc span{font-size:12px;color:var(--muted)}
.counts{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:14px}
.counts .k{display:flex;align-items:center;gap:8px}
.counts .k i{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;color:#fff;font-size:10px;font-weight:900}
.counts .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.keylist{display:flex;flex-direction:column;gap:6px}
.keym{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:7px;padding:8px 10px;text-align:left;width:100%}
.keym:hover{background:#2c2a27}
.keym i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:11px;font-weight:900}
.keym span{font-size:13.5px;line-height:1.35;min-width:0}
/* progreso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel2);border-radius:8px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.chart{background:var(--panel2);border-radius:8px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.glist{display:flex;flex-direction:column;gap:4px}
.grow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--panel2);border-radius:6px;padding:8px 10px;font-size:13.5px}
.grow .r{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:100;box-shadow:0 4px 18px rgba(0,0,0,.4);max-width:90vw;text-align:center;font-size:14px}
.empty{color:var(--dim);text-align:center;padding:16px;font-size:14px;line-height:1.5}

/* tablet: panel debajo */

.pbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.think{margin-left:0}
.clk{font-variant-numeric:tabular-nums;background:#2b2926;color:#8b8987;padding:5px 10px;border-radius:5px;font-size:20px;font-weight:800;min-width:88px;text-align:right;line-height:1.2}
.clk.on{background:#f5f5f4;color:#262421}
.clk.on.low{background:#d9493c;color:#fff}
.sq .mk{position:absolute;inset:0;background:rgba(235,97,80,.78)}
.guide{background:var(--panel2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--blue)}
.guide .gs b{display:block;font-size:13.5px;margin-bottom:2px}
.guide .gs div{font-size:13.5px;color:var(--muted);line-height:1.45}
.guide .btn{align-self:flex-start}
.glist2{margin:2px 0 0;padding-left:18px}
.glist2 li{margin:1px 0}.glist2 li.g{color:var(--green-t)}.glist2 li.b{color:#ffb3a8}
.ta,.inp{width:100%;background:#1b1a18;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:inherit;font-size:13.5px;resize:vertical;min-width:0}
.ta:focus,.inp:focus{outline:2px solid var(--green);outline-offset:0}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.rowbtns label.btn{cursor:pointer}
.theory .ta{margin-top:6px}
.resume{display:flex;align-items:center;gap:8px;background:#2f3a26;border:1px solid #45753c;border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.resume div{flex:1;min-width:140px}.resume b{display:block;font-size:14.5px}.resume span{font-size:12.5px;color:var(--muted)}
.btn.go2{background:var(--green);box-shadow:inset 0 -3px 0 var(--green-d)}

const PASSED = [0, 90, 60, 40, 25, 15, 10, 0]; // por fila desde la perspectiva del dueño (índice de fila 0 = 8ª)
const MB = new Array(120).fill(-1), M64 = new Array(64);

const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

class Chess {
  constructor(fen) { this.load(fen || START_FEN); }
  load(fen) {
    const [pos, turn, cast, ep, half, full] = fen.trim().split(/\s+/);
    this.b = new Array(64).fill('');
    let s = 0;
    for (const ch of pos) {
      if (ch === '/') continue;
      if (/\d/.test(ch)) s += +ch; else { this.b[s] = ch; if (ch === 'K') this.kw = s; if (ch === 'k') this.kb = s; s++; }
    }
    this.turn = turn || 'w';
    this.cr = 0; if (cast && cast !== '-') { if (cast.includes('K')) this.cr |= 1; if (cast.includes('Q')) this.cr |= 2; if (cast.includes('k')) this.cr |= 4; if (cast.includes('q')) this.cr |= 8; }
    this.ep = ep && ep !== '-' ? sqIdx(ep) : -1;
    this.half = +(half || 0); this.full = +(full || 1);
    this.hist = []; this.hash = this.computeHash(); this.keys = [this.hash];
    this.killers = []; this.nodes = 0;
  }
  computeHash() {
    let h = 0;
    for (let s = 0; s < 64; s++) if (this.b[s]) h ^= ZOB.pc[PIDX[this.b[s]]][s];

  }
  fen() {

    for (let r = 0; r < 8; r++) {
      let e = 0;
      for (let f = 0; f < 8; f++) { const p = this.b[r * 8 + f]; if (!p) e++; else { if (e) out += e; e = 0; out += p; } }

    }
    let c = ''; if (this.cr & 1) c += 'K'; if (this.cr & 2) c += 'Q'; if (this.cr & 4) c += 'k'; if (this.cr & 8) c += 'q';
    return `${out} ${this.turn} ${c || '-'} ${this.ep >= 0 ? sqName(this.ep) : '-'} ${this.half} ${this.full}`;
  }
  clone() { const c = new Chess(this.fen()); return c; }
  att(s, byW) {

    if (byW) { let t = MB[ms + 9]; if (t >= 0 && b[t] === 'P') return true; t = MB[ms + 11]; if (t >= 0 && b[t] === 'P') return true; }
    else { let t = MB[ms - 9]; if (t >= 0 && b[t] === 'p') return true; t = MB[ms - 11]; if (t >= 0 && b[t] === 'p') return true; }
    const N = byW ? 'N' : 'n', K = byW ? 'K' : 'k', B = byW ? 'B' : 'b', R = byW ? 'R' : 'r', Q = byW ? 'Q' : 'q';
    for (const o of NO) { const t = MB[ms + o]; if (t >= 0 && b[t] === N) return true; }

  }

    for (const o of NO) { const t = MB[ms + o]; if (t >= 0 && b[t] === N) out.push(t); }
    for (const o of KO) { const t = MB[ms + o]; if (t >= 0 && b[t] === K) out.push(t); }

        if ((this.cr & 4) && b[4] === 'k' && b[7] === 'r' && !b[5] && !b[6] && !this.att(4, true) && !this.att(5, true) && !this.att(6, true)) m.push({ f: 4, t: 6, p: 'k', c: '', fl: 'k' });

  }
  make(m) {
    const b = this.b, Z = ZOB;
    this.hist.push([m, this.cr, this.ep, this.half, this.hash]);
    let h = this.hash ^ Z.cr[this.cr];

  }
  moves() {
    const out = [];
    for (const m of this.gen(false)) { this.make(m); if (this.legalAfter()) out.push(m); this.unmake(); }

  findMove(uci) {

        if (others.length) {
          if (!others.some(x => (x.f & 7) === (m.f & 7))) d = 'abcdefgh'[m.f & 7];

    return false;

const CLS = {

  best: { label: 'La mejor', sym: '★', short: '★', color: '#81b64c' },
  excellent: { label: 'Excelente', sym: '!', short: '!', color: '#81b64c' },
  good: { label: 'Buena', sym: '✓', short: '✓', color: '#77915f' },
  inacc: { label: 'Imprecisión', sym: '?!', short: '?!', color: '#f7c631' },

const CLS_ORDER = ['brilliant', 'best', 'excellent', 'good', 'book', 'inacc', 'mistake', 'blunder'];
// pérdida efectiva: lo que cae tu % de victoria, o el material/ventaja que regalás (lo que sea mayor).
// Así, regalar la dama en una posición ya perdida también cuenta como error.
function effLoss(before, after, forAcc) {

// ---- clasificar y explicar una jugada del alumno ----
// A: análisis antes {uci, score, pv} (score desde el que juega). B: análisis después (score desde el rival).
function explainMove(fenBefore, uci, A, B, opts) {

    }

    if (fullmove <= 12 && !m.c) {
      const home = side === 'w' ? [57, 62, 58, 61] : [1, 6, 2, 5];
      if ((t === 'N' || t === 'B') && home.includes(m.f)) lines.push(`Desarrollás ${pname(m.p, 'tu')}: cada pieza fuera de su casilla inicial suma.`);
      if (t === 'P' && [3, 4].includes(m.t & 7) && [3, 4].includes(m.t >> 3)) lines.push('Peón al centro: controlás casillas importantes.');
    }
    const fk = forkTargets(c, m.t).filter(x => x.p.toUpperCase() !== 'P');

    else {
      const th = hanging(c, side === 'w' ? 'b' : 'w').filter(h => c.attackers(h.s, side === 'w').includes(m.t));

    }

        else if (bestM.c) lines.push(`Lo mejor era ${bestSan}, capturando ${PIECE_AT(bestM.c, bestM.t, 'el')}.`);

// ---- amenaza del rival (análisis con "jugada nula") ----

    const fk = forkTargets(f, m.t).filter(x => x.p.toUpperCase() !== 'P');

// ---- "¿Qué hago ahora?" ----
function planAdvice(fen, A, threat) {

  if (A && isMate(A.score) && A.score > 0) out.push({ t: 'Hay mate', d: `Tenés mate en ${mateIn(A.score)}. Buscá jaques que dejen al rey sin casillas.` });

    if (opHang.length && bm && bm.c) out.push({ t: 'Algo para ganar', d: 'El rival tiene una pieza mal defendida. Revisá todas tus capturas.' });
    else if (bm) {
      const cb = c.clone(); cb.make(bm);
      const fk = forkTargets(cb, bm.t).filter(x => x.p.toUpperCase() !== 'P');
      if (fk.length >= 2 && A.score > 150) out.push({ t: 'Táctica disponible', d: 'Hay un ataque doble: una de tus piezas puede atacar dos cosas a la vez.' });
    }

    else if (!hasCastled(c, side) && (c.cr & (side === 'w' ? 3 : 12)) && ph > 16) out.push({ t: 'Preparar el enroque', d: 'Despejá las casillas entre el rey y la torre para poder enrocar.' });
    // torres a columnas abiertas

    const files = [];
    for (let f = 0; f < 8; f++) { let mine = 0, theirs = 0, rook = 0; for (let r = 0; r < 8; r++) { const p = c.b[r * 8 + f]; if (p === myP) mine++; else if (p === opP) theirs++; else if (p === myR) rook++; } if (!mine && !rook) files.push({ f, open: !theirs }); }
    const rooks = c.b.map((p, s) => p === myR ? s : -1).filter(s => s >= 0);
    if (files.length && rooks.length && hasCastled(c, side) && !und.length) {
      const fo = files.find(x => x.open) || files[0];
      out.push({ t: 'Torres activas', d: `La columna ${'abcdefgh'[fo.f]} está ${fo.open ? 'abierta' : 'semiabierta'}. Llevá una torre ahí para presionar.` });
    }
  } else {
    out.push({ t: 'Final: activá el rey', d: 'Con pocas piezas el rey deja de esconderse: llevalo al centro y usalo para atacar peones.' });

    const w = side === 'w';
    for (let s = 0; s < 64; s++) {
      if (c.b[s] !== (w ? 'P' : 'p')) continue;
      const f = s & 7, r = s >> 3; let passed = true;
      for (let df = -1; df <= 1; df++) { const ff = f + df; if (ff < 0 || ff > 7) continue; for (let rr = 0; rr < 8; rr++) { if ((w && rr < r) || (!w && rr > r)) if (c.b[rr * 8 + ff] === (w ? 'p' : 'P')) passed = false; } }
      if (passed) { out.push({ t: 'Peón pasado', d: `Tu peón de ${sqName(s)} no tiene peones rivales que lo frenen. Empujalo con apoyo del rey o las torres.` }); break; }
    }
  }
  // peor pieza
  if (out.length < 3 && !und.length && ph <= 18) {
    let worst = null;
    for (let s = 0; s < 64; s++) {
      const p = c.b[s]; if (!p || isW(p) !== (side === 'w')) continue;
      const t = p.toUpperCase(); if (t === 'P' || t === 'K') continue;

  return out.slice(0, 4);
}
// ---- explicar una jugada del rival (para la revisión) ----
function explainRival(fenBefore, uci, A, B, opts) {
  opts = opts || {};

  const san = c.san(m, legal);
  const before = A.score, after = -B.score;

  const isBest = A.uci === uci;
  let key;

  else if (loss < 2.5) key = 'excellent';
  else if (loss < 6) key = 'good';
  else if (loss < 12) key = 'inacc';
  else if (loss < 22) key = 'mistake';
  else key = 'blunder';
  const bestM = A.uci ? c.findMove(A.uci) : null;
  const bestSan = bestM ? c.san(bestM, legal) : '';
  c.make(m);
  const lines = [];

  const refSan = ref ? c.san(ref) : '';
  if (['best', 'excellent', 'good', 'book'].includes(key)) {
    if (key === 'book') lines.push('Jugada de teoría.');
    if (c.inCheck() && !c.moves().length) lines.push('Jaque mate.');
    else if (isMate(after) && after > 0) lines.push(`El rival va camino al mate en ${mateIn(after)}.`);
    if (m.fl === 'k' || m.fl === 'q') lines.push('El rival enroca y pone su rey a salvo.');
    else if (m.c) lines.push(`El rival captura ${PIECE_AT(m.c, m.t, 'tu')}.`);
    if (c.inCheck() && c.moves().length) lines.push('Te da jaque.');
    if (!lines.length) lines.push('Jugada correcta del rival.');

    if (isMate(after) && after < 0) lines.push(`Error del rival: te dejó mate en ${mateIn(after)} con ${sanLine(c.fen(), B.pv, 5)}.`);
    else if (ref && ref.c) lines.push(`Error del rival: podías ganar material con ${refSan}, capturando ${PIECE_AT(ref.c, ref.t, 'el')}.`);
    else if (refSan) lines.push(`Error del rival: lo podías aprovechar con ${refSan}.`);

}
// curva de % de victoria (misma escala que usan los sitios de ajedrez para la precisión)

  g.result = { r: st.result, reason: st.reason, win, draw };

    const rated = !g.undo; let delta = 0;
    if (rated) { const score = win ? 1 : draw ? 0.5 : 0, exp = 1 / (1 + Math.pow(10, (g.bot.elo - P.rating) / 400)); delta = Math.round(32 * (score - exp)); P.rating = Math.max(100, P.rating + delta); }

    let r = await ask({ mode: 'think', fen: S.start, moves: S.moves.slice(0, k), depth: DEEP.depth, time: DEEP.time });
    if (S.game !== g || !g.over) return;

}

// ---------- APERTURAS ----------
function startOpening(o) {
  resetBoard(START_FEN, []);
  S.mode = 'opening'; S.user = o.color; S.orient = o.color;
  S.lesson = { o, i: 0, wrong: 0, done: false, msg: { kind: 'intro', text: o.intro } };

}
function lessonStep() {
  const L = S.lesson;
  if (L.i >= L.o.steps.length) { L.done = true; P.openings[L.o.id] = true; saveP(); sGood(); render(); return; }
  if (S.c.turn !== S.user) {
    S.busy = true;
    setTimeout(() => {
      if (S.lesson !== L || S.mode !== 'opening') return;
      const [u, txt] = L.o.steps[L.i];
      pushMove(S.c.findMove(u)); L.msg = { kind: 'opp', san: S.sans[S.sans.length - 1], text: txt }; L.i++; S.busy = false;
      render(); lessonStep();
    }, L.i === 0 ? 600 : 900);
  } else renderPanel();
}
function openingUserMove(m) {
  const L = S.lesson, u = S.c.uci(m), [eu, txt] = L.o.steps[L.i];
  if (u === eu) {
    pushMove(m); L.msg = { kind: 'ok', san: S.sans[S.sans.length - 1], text: txt }; L.i++; L.wrong = 0;
    render(); lessonStep();
  } else {
    L.wrong++; sBad();
    const em = S.c.findMove(eu);
    if (L.wrong === 1) { S.hintSq = em.f; L.msg = { kind: 'no', text: `${S.c.san(m)} no es la jugada de esta línea. Pista: mové ${PIECE_AT(em.p, em.f, 'tu')}.` }; }
    else { S.hintSq = -1; S.arrows = [{ f: em.f, t: em.t, color: COL.hint }]; L.msg = { kind: 'no', text: `La jugada de la línea es ${S.c.san(em)}. Seguí la flecha.` }; }

// ---------- TÁCTICA ----------
function startTheme(t, k) { S.mode = 'puzzle'; S.puzzle = { t, k: k || 0 }; loadPuzzle(); }
function loadPuzzle() {
  const Z = S.puzzle, p = Z.t.puzzles[Z.k];
  resetBoard(p.fen, []); S.user = S.c.turn; S.orient = S.user;
  Z.step = 0; Z.wrong = 0; Z.done = false; Z.rated = false; Z.delta = null;
  const col = S.user === 'w' ? 'blancas' : 'negras';
  Z.msg = { kind: 'intro', text: Z.t.kind === 'review' ? `En tu partida contra ${p.mist.opp} jugaste <b>${p.mist.played}</b> acá. Juegan las ${col}: encontrá una jugada mejor.` : `Juegan las ${col}. Encontrá la mejor jugada.` };
  render();
}
async function puzzleUserMove(m) {
  const Z = S.puzzle, p = Z.t.puzzles[Z.k], u = S.c.uci(m), exp = p.sol[Z.step];
  let ok = u === exp;
  if (!ok) { S.c.make(m); ok = S.c.inCheck() && !S.c.moves().length; S.c.unmake(); }
  if (!ok && Z.t.kind === 'review' && p.bs != null) {
    S.busy = true;
    const r = await ask({ mode: 'think', fen: S.c.fen(), moves: [S.c.uci(m)], depth: 6, time: 500 });
    S.busy = false;
    if (S.puzzle !== Z) return;
    if (r) { const s = -r.score; ok = s >= p.bs - 60 && (p.bs < 150 || s >= 100); }
  }
  if (!ok) {
    Z.wrong++; sBad(); ratePuzzle(Z, 0);
    const em = S.c.findMove(exp);
    if (Z.wrong === 1) { S.hintSq = em.f; Z.msg = { kind: 'no', text: `${S.c.san(m)} no es. Pista: la jugada empieza con ${PIECE_AT(em.p, em.f, 'tu')}.` }; }
    else { S.arrows = [{ f: em.f, t: em.t, color: COL.hint }]; Z.msg = { kind: 'no', text: `La solución es ${S.c.san(em)}.` }; }
    renderBoard(); renderPanel(); return;
  }
  pushMove(m); Z.step++;
  if (Z.step >= p.sol.length || (S.c.inCheck() && !S.c.moves().length)) {
    if (S.c.inCheck() && !S.c.moves().length) confetti();
    Z.done = true; Z.msg = { kind: 'ok', text: p.text };
    if (Z.t.kind) { ratePuzzle(Z, 1); if (Z.t.kind === 'daily') { P.daily = { date: todayKey(), ok: !Z.wrong }; dailyDone(); } }
    else { const solved = P.tactics[Z.t.id] || (P.tactics[Z.t.id] = {}); if (!Z.wrong) solved[Z.k] = true; else if (!solved[Z.k]) solved[Z.k] = 'h'; }
    saveP(); sGood(); render(); return;
  }
  Z.msg = { kind: 'ok', text: '¡Bien! Esperá la respuesta del rival…' }; render();
  if (p.sol[Z.step] === '*') {
    S.busy = true;
    const r = await ask({ mode: 'think', fen: S.start, moves: S.moves.slice(), depth: 4, time: 500 });
    await delay(450);
    if (S.puzzle !== Z || S.mode !== 'puzzle') return;
    pushMove(S.c.findMove(r.uci)); Z.step++; S.busy = false;
    Z.msg = { kind: 'ok', text: `El rival respondió ${S.sans[S.sans.length - 1]}. Ahora terminá la combinación.` };
    render();
  }
}

// ---------- PGN ----------
function sanToMove(c, tok) {
  tok = tok.replace(/[+#!?]+$/g, '').replace(/^0-0-0$/, 'O-O-O').replace(/^0-0$/, 'O-O');
  const legal = c.moves();
  if (tok === 'O-O') return legal.find(m => m.fl === 'k') || null;
  if (tok === 'O-O-O') return legal.find(m => m.fl === 'q') || null;
  const mt = tok.match(/^([KQRBN])?([a-h])?([1-8])?x?([a-h][1-8])(?:=?([QRBNqrbn]))?$/);
  if (!mt) return null;
  const [, pc, ff, fr, to, pr] = mt, t = sqIdx(to), type = pc || 'P';
  return legal.find(m => m.t === t && m.p.toUpperCase() === type && (!ff || 'abcdefgh'[m.f & 7] === ff) && (!fr || String(8 - (m.f >> 3)) === fr) && (pr ? m.pr === pr.toLowerCase() : (!m.pr || m.pr === 'q'))) || null;
}
function parsePGN(text) {
  const headers = {};
  (text || '').replace(/\[(\w+)\s+"([^"]*)"\]/g, (_, k, v) => { headers[k] = v; return ''; });
  let body = (text || '').replace(/\[[^\]]*\]/g, ' ').replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ');
  let prev; do { prev = body; body = body.replace(/\([^()]*\)/g, ' '); } while (body !== prev);
  body = body.replace(/\$\d+/g, ' ').replace(/\d+\.(\.\.)?/g, ' ').replace(/…/g, ' ');
  const start = headers.FEN || START_FEN;
  let c; try { c = new Chess(start); } catch (e) { return { error: 'La posición inicial del PGN no es válida.' }; }
  const moves = [];
  for (const tok of body.split(/\s+/).filter(Boolean)) {
    if (/^(1-0|0-1|1\/2-1\/2|\*)$/.test(tok)) break;
    const m = sanToMove(c, tok);
    if (!m) return { error: `No pude leer la jugada «${tok}» (cerca de la jugada ${c.full}). Revisá que hayas pegado el PGN completo.` };
    moves.push(c.uci(m)); c.make(m);
  }
  if (!moves.length) return { error: 'No encontré jugadas. Pegá el PGN completo de la partida.' };
  return { moves, headers, start };
}
function termReason(t) {
  t = (t || '').toLowerCase();
  if (t.includes('checkmate')) return 'jaque mate'; if (t.includes('resign')) return 'abandono'; if (t.includes('time')) return 'tiempo';
  if (t.includes('stalemate')) return 'ahogado'; if (t.includes('repetition')) return 'repetición'; if (t.includes('agreement')) return 'acuerdo'; if (t.includes('abandon')) return 'abandono';
  if (t.includes('insufficient')) return 'material insuficiente';
  return 'fin de la partida';
}
function runImport() {
  const txt = $('#pgn').value, user = ($('#impuser').value || '').trim();
  S.importText = txt; P.ccUser = user; saveP();

  S.importErr = '';
  const H = r.headers; let color = S.impColor;
  if (color === 'auto') {

function bankPick(excludeId) {

}

function addMistakes(g) {
  if (g.end) return 0;
  let n = 0;
  for (let i = g.startPly; i < S.moves.length; i++) {
    const r = S.rec[i];
    if (!r || r.rival || !['mistake', 'blunder'].includes(r.key) || !r.bestUci) continue;
    const fen = S.fens[i];
    if (P.mist.some(x => x.fen === fen)) continue;
    P.mist.push({ id: 'm' + Date.now().toString(36) + i, fen, best: r.bestUci, bs: r.before, played: r.san, bestSan: r.bestSan, opp: g.bot.name, lvl: 0, due: Date.now(), d: Date.now() });

function ratePuzzle(Z, score) {
  if (Z.rated) return; Z.rated = true;
  const t = Z.t, p = t.puzzles[Z.k];
  if ((t.kind === 'bank' || t.kind === 'daily') && p.rating) {
    const exp = 1 / (1 + Math.pow(10, (p.rating - P.tacRating) / 400));
    Z.delta = Math.round(24 * (score - exp)); P.tacRating = Math.max(100, P.tacRating + Z.delta);
    if (t.kind === 'bank') P.bank[p.id] = score ? 1 : 0.5;
  }
  if (t.kind === 'review') {
    const x = P.mist.find(m => m.id === p.id);
    if (x) {

}

// ---------- pensamiento guiado ----------
function guidedHTML() {
  if (S.gply !== S.moves.length) { S.gply = S.moves.length; S.gstep = 0; }
  const c = S.c, side = c.turn, opp = side === 'w' ? 'b' : 'w', legal = c.moves();
  const checks = [], caps = [];
  for (const m of legal) {
    const san = c.san(m, legal); c.make(m);
    const chk = c.inCheck(), att = c.attackers(m.t, opp === 'w').length, def = c.attackers(m.t, side === 'w').length;
    c.unmake();
    const pv = VAL[m.p.toUpperCase()] || 2000, cv = m.c ? VAL[m.c.toUpperCase()] : 0;
    let note, cls = '';
    if (!att) { note = m.c ? `gana ${pname(m.c, 'un')} sin riesgo` : 'la pieza queda segura'; cls = 'g'; }
    else if (m.p.toUpperCase() === 'K') { note = ''; }
    else if (pv <= cv) { note = 'cambio a tu favor o parejo'; cls = 'g'; }
    else if (def) { note = 'te la pueden cambiar: contá bien'; }
    else { note = 'la pieza queda colgada'; cls = 'b'; }
    if (chk) checks.push({ san, note, cls });
    if (m.c) caps.push({ san, note, cls });
  }
  const li = a => a.length ? `<ul class="glist2">${a.slice(0, 8).map(x => `<li class="${x.cls}"><b>${x.san}</b>${x.note ? ' — ' + x.note : ''}</li>`).join('')}</ul>` : '';
  const steps = [
    ['¿Qué quiere hacer el rival?', S.threat ? S.threat.text : 'No veo amenazas directas. Igual mirá qué pieza movió y qué ataca ahora.'],
    ['Tus jaques', checks.length ? li(checks) : 'No tenés jaques.'],
    ['Tus capturas', caps.length ? li(caps) : 'No tenés capturas.'],
    ['Elegí tu jugada', 'Si ningún jaque o captura sirve, mejorá tu peor pieza o seguí un plan (tocá «¿Qué hago?»).']
  ];
  return `<div class="guide"><div class="lbl">Antes de mover · pensamiento guiado</div>${steps.slice(0, S.gstep + 1).map((s, i) => `<div class="gs"><b>${i + 1}. ${s[0]}</b><div>${s[1]}</div></div>`).join('')}${S.gstep < 3 ? '<button class="btn sm" data-act="gnext">Siguiente paso</button>' : ''}</div>`;
}

// ---------- exportar / instalar ----------
function exportCode() { try { return btoa(unescape(encodeURIComponent(JSON.stringify(P)))); } catch (e) { return ''; } }
function importCode(s) {
  try {
    const raw = (s || '').trim(); const txt = raw.startsWith('{') ? raw : decodeURIComponent(escape(atob(raw)));
    const o = JSON.parse(txt); if (!o || typeof o !== 'object' || !('rating' in o)) return false;
    localStorage.setItem(STORE, JSON.stringify(o)); P = loadP(); saveP(); return true;
  } catch (e) { return false; }
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.screen === 'progress' && S.mode === 'menu') renderPanel(); });
const IN_FRAME = (() => { try { return window.top !== window; } catch (e) { return true; } })();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !IN_FRAME && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function syncPanel() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="lbl">Instalar en el celular</div>
    <div class="theory">${installEvt ? '<button class="btn go" data-act="install" style="width:100%">Instalar la app</button>' : ios ? 'En iPhone: abrí la página en <b>Safari</b>, tocá <b>Compartir</b> y después <b>Agregar a inicio</b>. Queda como una app con ícono propio y funciona sin internet.' : 'En Android: abrí la página en <b>Chrome</b>, tocá el menú <b>⋮</b> y elegí <b>Instalar app</b> o <b>Agregar a pantalla principal</b>. Queda como una app y funciona sin internet.'}${IN_FRAME ? '<br><span class="muted">Para instalarla, usá la versión de tu página de GitHub.</span>' : ''}</div>
    <div class="lbl">Pasar tu progreso a otro dispositivo</div>
    <div class="theory">
      <p style="margin:0 0 8px">1) En este dispositivo tocá «Copiar código». 2) En el otro, pegalo abajo y tocá «Importar».</p>
      <div class="rowbtns"><button class="btn sm" data-act="exp-copy">Copiar código</button>${!IN_FRAME ? '<button class="btn sm" data-act="exp-file">Descargar archivo</button>' : ''}<label class="btn sm" for="impfile">Cargar archivo</label><input type="file" id="impfile" accept=".json,.txt" hidden></div>
      ${S.expShow ? `<textarea class="ta" rows="3" readonly id="expta">${exportCode()}</textarea>` : ''}
      <textarea class="ta" rows="3" id="impta" placeholder="Pegá acá el código de progreso"></textarea>
      <button class="btn sm" data-act="imp-code" style="margin-top:6px">Importar</button>
    </div>`;
}
document.addEventListener('change', e => {
  if (e.target.id !== 'impfile') return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { if (importCode(String(rd.result))) { applyBoardTheme(); render(); toast('Progreso importado'); } else toast('El archivo no es un progreso válido'); };
  rd.readAsText(f);
});
function handleExtraAct(act, el, e) {
  switch (act) {
    case 'gnext': S.gstep = Math.min(3, S.gstep + 1); renderPanel(); return true;
    case 'resume': resumeCurrent(); return true;
    case 'discard': P.current = null; saveP(); renderPanel(); return true;
    case 'import': S.sub = 'import'; S.importErr = ''; renderPanel(); return true;
    case 'imp-back': S.sub = null; renderPanel(); return true;
    case 'imp-go': runImport(); return true;
    case 'daily': startDaily(); return true;
    case 'bank': startBank(); return true;
    case 'bank-next': startBank(S.puzzle && S.puzzle.t.puzzles[0].id); return true;
    case 'mreview': startReview(); return true;
    case 'guided-lesson': S.screen = 'play'; startGame({ bot: BOTS[2], color: 'r', coach: true, guided: true }); return true;
    case 'tguided': P.guided = !P.guided; saveP(); renderPanel(); return true;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; } return true;
    case 'exp-copy': {
      const code = exportCode(); S.expShow = true;
      const done = () => toast('Código copiado'); const fail = () => { renderPanel(); const ta = $('#expta'); if (ta) { ta.focus(); ta.select(); } toast('Copiá el código seleccionado'); };
      try { navigator.clipboard.writeText(code).then(() => { renderPanel(); done(); }, fail); } catch (_) { fail(); }
      return true;
    }
    case 'exp-file': {
      try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(P)], { type: 'application/json' })); a.download = 'progreso-ajedrez-' + todayKey() + '.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (_) {}
      return true;
    }
    case 'imp-code': { const v = ($('#impta') || {}).value; if (importCode(v)) { applyBoardTheme(); render(); toast('Progreso importado'); } else toast('Ese código no es válido'); return true; }
  }
  return false;
}
applyBoardTheme();
toMenu();

</script>
